<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>咕咕鸡大作战</title>
<meta name="description" content="咕咕鸡大作战工具首页：基金估值、QD鸡额度监控、A股资金流向、大衍筮法、证券从业考试题库。" />
<style>
:root{--primary:#fbc02d;--secondary:#2c3e50;--bg:#fffdf2;--card:#fff;--border:#ffecb3;--muted:#999}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at top,#fff8d8 0,#fffdf2 42%,#fff 100%);
  color:#333;display:flex;align-items:center;justify-content:center;padding:12px 14px;
}
.shell{width:100%;max-width:920px}
.hero{text-align:center;margin-bottom:12px}
.logo{font-size:28px;line-height:1;margin-bottom:2px}
h1{margin:0;color:var(--secondary);font-size:22px;letter-spacing:.03em}
.hero p{margin:4px 0 0;color:#888;font-size:12px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.card{
  display:flex;flex-direction:column;min-height:0;height:100%;
  text-decoration:none;color:var(--secondary);background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:12px 12px 10px;
  box-shadow:0 6px 18px rgba(251,192,45,.10);transition:.15s;position:relative;overflow:hidden;
}
.card:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(251,192,45,.14),transparent 42%);
  opacity:.7;pointer-events:none;
}
.card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 10px 24px rgba(251,192,45,.2)}
.icon{font-size:22px;margin-bottom:6px;position:relative;line-height:1;display:flex;align-items:center;min-height:22px}
.icon img{width:22px;height:22px;display:block;border-radius:5px}
.title{font-size:15px;font-weight:800;margin-bottom:4px;position:relative}
.desc{font-size:11px;color:#777;line-height:1.45;position:relative;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link{margin-top:8px;font-size:11px;color:#b8860b;font-weight:700;position:relative}
.footer{text-align:center;color:#bbb;font-size:11px;margin-top:12px}
/* 5 cards: last two span nicely on 3-col grid */
.card:nth-child(4){grid-column:1 / 2}
.card:nth-child(5){grid-column:2 / 3}
@media(max-width:720px){
  body{align-items:flex-start;padding:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card:nth-child(4),.card:nth-child(5){grid-column:auto}
  .card:nth-child(5){grid-column:1 / -1}
  h1{font-size:20px}.logo{font-size:24px}
}
@media(max-height:700px){
  .hero{margin-bottom:8px}
  .desc{display:none}
  .card{padding:10px}
  .link{margin-top:6px}
}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="logo">🐤</div>
    <h1>咕咕鸡大作战</h1>
    <p>赚钱要看净值进程、运气，也要靠自己的努力</p>
  </section>

  <section class="grid" aria-label="咕咕鸡工具入口">
    <a class="card" href="https://ji.guguji.icu">
      <div class="icon">📈</div>
      <div class="title">基金估值仪表盘</div>
      <div class="desc">基金净值、估值、组合收益与历史记录。</div>
      <div class="link">ji.guguji.icu →</div>
    </a>

    <a class="card" href="https://qdii.guguji.icu">
      <div class="icon">🐤</div>
      <div class="title">QD鸡 · 额度监控</div>
      <div class="desc">QDII 申购状态、限额变化与重仓时间线。</div>
      <div class="link">qdii.guguji.icu →</div>
    </a>

    <a class="card" href="https://gu.guguji.icu">
      <div class="icon"><img src="./favicon.svg" alt=""></div>
      <div class="title">缅A资金大作战</div>
      <div class="desc">A 股行业/概念资金流向、盘中轨迹与量能。</div>
      <div class="link">gu.guguji.icu →</div>
    </a>

    <a class="card" href="https://yi.guguji.icu">
      <div class="icon">🔮</div>
      <div class="title">大衍筮法</div>
      <div class="desc">三变十八演推卦，本卦/变卦与白话解读。</div>
      <div class="link">yi.guguji.icu →</div>
    </a>

    <a class="card" href="https://test.guguji.icu">
      <div class="icon">📚</div>
      <div class="title">证券从业题库</div>
      <div class="desc">证券从业备考刷题、练习与复盘。</div>
      <div class="link">test.guguji.icu →</div>
    </a>
  </section>

  <footer class="footer">© 2026-2028 咕咕鸡大作战</footer>
</main>
</body>
</html>
